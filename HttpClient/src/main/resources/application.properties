# 服务名
spring.application.name=HttpClient

# 监听端口：Android 端拼地址时要用（真机填电脑局域网 IP，模拟器填 10.0.2.2）
server.port=8080
# 默认就监听 0.0.0.0，同一局域网内的手机才能访问；只在需要限制时改成具体 IP
server.address=0.0.0.0

# 上传体积上限。默认只有 1MB，手机相册里的照片动辄 3~8MB，
# 不改的话上传会直接被拒（MaxUploadSizeExceededException / HTTP 413）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# 调试时可以打开，能看到 Spring 实际匹配到的接口和请求参数
# logging.level.org.springframework.web=DEBUG
